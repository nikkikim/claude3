# Rebuilds the HTML pages whenever the content (or the generator) changes,
# e.g. after you save something in /admin/. Uses only Python 3 from the runner.
name: Rebuild site

on:
  push:
    branches: [main, claude/adoring-bohr-8s0tqm]
    paths:
      - 'content/**'
      - 'assets/works/**'
      - 'assets/*'
      - 'build.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rebuild-site-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build pages
        run: python3 build.py

      - name: Commit the generated pages
        run: |
          git config user.name "site-builder[bot]"
          git config user.email "site-builder@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing changed."
            exit 0
          fi
          git commit -m "Rebuild site"
          for i in 1 2 3 4; do
            git pull --rebase origin "${{ github.ref_name }}" && git push origin "HEAD:${{ github.ref_name }}" && exit 0
            sleep $((i * 3))
          done
          exit 1
