<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>Dasul Kim — Portfolio</title>
<style>
@page{size:1440px 810px;margin:0}
html,body{margin:0;padding:0;width:1440px;background:#fff}
.spread{page-break-after:always;break-after:page}
.spread:last-child{page-break-after:auto;break-after:auto}
</style>
<link rel="stylesheet" href="portfolio.css">
</head>
<body>
<script src="render.js"></script>
<script>
(function () {
  fetch('../content/portfolio.json', { cache: 'no-store' })
    .then(function (r) { return r.json(); })
    .then(function (data) {
      document.title = 'Dasul Kim — Portfolio ' + (data.year || '');
      return Portfolio.buildAll(document.body, data, function (n) { return 'img/' + n; });
    })
    .then(function () { return Portfolio.shrink(document.body, 1.0, 0.8); })
    .then(function () { return document.fonts.ready; })
    .then(function () { window.__ready = true; })
    .catch(function (e) { window.__error = String(e); window.__ready = true; });
})();
</script>
</body>
</html>
